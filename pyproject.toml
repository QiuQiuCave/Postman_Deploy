[project]
name = "r2v2-deploy"
version = "0.2.0"
description = "R2V2 single-network bottle delivery CONTACT simulation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=1.26,<3", "PyYAML>=6,<7", "scipy>=1.10,<2", "onnx>=1.21,<2", "onnxruntime>=1.23,<2", "ruckig==0.12.2"]

[project.optional-dependencies]
sim = ["mujoco==3.7.0"]
visualization = ["imageio>=2.37,<3", "imageio-ffmpeg>=0.6,<1", "Pillow>=10"]
test = ["pytest>=8,<9"]
# Legacy G1 hardware code is not part of the supported R2V2 package interface.
# SDK installation and robot safety commissioning remain a separate workflow.

[project.scripts]
r2v2-delivery = "r2v2_deploy.cli.delivery:main"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/r2v2_deploy"]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.hatch.build.targets.wheel.force-include]
"assets" = "r2v2_deploy/_resources/assets"
"r2v2_description/README.md" = "r2v2_deploy/_resources/r2v2_description/README.md"
"deploy_mujoco/config" = "r2v2_deploy/_resources/deploy_mujoco/config"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
constraint-dependencies = ["numpy==2.4.4", "scipy==1.17.1", "onnxruntime==1.23.2", "ruckig==0.12.2"]
